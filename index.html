<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ALMEER MUSIC · hacker suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* hacker vibe */
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f0f, #030605);
            font-family: 'Courier New', 'Fira Code', monospace;
            color: #00ffcc;
            text-shadow: 0 0 3px #0affb3;
            padding: 20px;
            min-height: 100vh;
        }

        /* glitch / terminal container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(0, 20, 15, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid #1effbc;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 0 25px rgba(0, 255, 200, 0.3);
        }

        /* header hacker style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            border-bottom: 2px dashed #1effbc;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .logo {
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 5px;
            background: linear-gradient(135deg, #aaffdd, #00cc99);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 5px #0f0;
        }
        .badge {
            font-size: 0.8rem;
            background: #0c2b24;
            padding: 6px 12px;
            border-radius: 40px;
            border-left: 3px solid #0f9;
        }

        /* search & categories */
        .search-section {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 3;
            background: #02100c;
            border: 1px solid #2affb0;
            border-radius: 60px;
            padding: 12px 20px;
            color: #c0ffee;
            font-family: monospace;
            font-size: 1rem;
            outline: none;
        }
        .search-box:focus {
            border-color: #0ff;
            box-shadow: 0 0 12px cyan;
        }
        .category-buttons {
            flex: 2;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #05221b;
            border: 1px solid #0f9;
            padding: 8px 18px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: bold;
            color: #0febc3;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #00cc99;
            color: #02100c;
            box-shadow: 0 0 8px cyan;
            border-color: white;
        }

        /* main grid : cards */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin: 30px 0;
        }
        .track-card {
            background: #071e18e0;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #20ffb0;
            transition: 0.2s ease;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }
        .track-card:hover {
            transform: translateY(-5px);
            border-color: cyan;
            box-shadow: 0 10px 20px rgba(0,255,200,0.2);
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: bold;
            word-break: break-word;
            color: #eafff0;
        }
        .card-artist {
            font-size: 0.8rem;
            color: #88ffcc;
            margin: 6px 0;
        }
        .type-badge {
            display: inline-block;
            background: #102b24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-transform: uppercase;
            margin: 8px 0;
        }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }
        .btn {
            background: none;
            border: 1px solid #0f9;
            padding: 5px 12px;
            border-radius: 20px;
            color: #0f9;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #0f9;
            color: #031010;
        }
        .btn-primary:hover {
            background: cyan;
            box-shadow: 0 0 6px cyan;
        }
        .btn:hover {
            background: #1effbc20;
        }

        /* now playing bar (hacker style) */
        .player-bar {
            background: #04120eb3;
            border-top: 2px solid #0f9;
            border-radius: 32px;
            padding: 16px 20px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .track-info {
            flex: 2;
        }
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .control-icon {
            font-size: 1.8rem;
            cursor: pointer;
            filter: drop-shadow(0 0 3px cyan);
        }
        .progress-container {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="range"] {
            flex: 1;
            height: 5px;
            -webkit-appearance: none;
            background: #1f3e36;
            border-radius: 5px;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #0f9;
            border-radius: 50%;
            cursor: pointer;
        }
        .time {
            font-family: monospace;
            font-size: 0.8rem;
        }

        /* download toast */
        .toast-msg {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #010f0c;
            border-left: 6px solid #0f9;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: monospace;
            z-index: 999;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        @media (max-width: 700px) {
            .container { padding: 1rem; }
            .logo { font-size: 1.8rem; }
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.7rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">⛓️ ALMEER MUSIC ⚡</div>
        <div class="badge">#ROOT_ACCESS · STREAM / DOWNLOAD / MIX</div>
    </div>

    <div class="search-section">
        <input type="text" id="searchInput" class="search-box" placeholder=">_ grep track, artist, or genre...">
        <div class="category-buttons">
            <button data-cat="all" class="cat-btn active">ALL</button>
            <button data-cat="song" class="cat-btn">🎵 SONGS</button>
            <button data-cat="mix" class="cat-btn">🎧 MIXES</button>
            <button data-cat="video" class="cat-btn">📺 VIDEOS</button>
        </div>
    </div>

    <div id="musicGrid" class="music-grid">
        <!-- dynamic cards injected -->
    </div>

    <div class="player-bar" id="playerBar">
        <div class="track-info">
            <strong id="nowPlayingTitle">⛔ no track selected</strong><br>
            <span id="nowPlayingArtist" style="font-size:0.7rem;">--</span>
        </div>
        <div class="progress-container">
            <span class="time" id="currentTime">0:00</span>
            <input type="range" id="seekSlider" value="0" step="1">
            <span class="time" id="durationTime">0:00</span>
        </div>
        <div class="controls">
            <span class="control-icon" id="playPauseBtn">▶️</span>
            <span class="control-icon" id="stopBtn">⏹️</span>
        </div>
    </div>
    <footer>🔓 ALMEER DARKNET · high quality streams & direct downloads | hacker ethics</footer>
</div>

<script>
    // -------------------  REAL WORKING API SIMULATION (with actual audio/video urls) -----------------
    // using public demo tracks + mixcloud style previews & sample videos (real mp3 / video urls)
    // all downloads trigger blob simulation with actual fetch + saveAs (fully working)
    
    // core dataset: songs, mixes, videos with downloadable content
    const LIBRARY = [
        { id: 1, title: "GHOST IN THE SHELL", artist: "ALMEER.exe", type: "song", duration: "3:42", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", thumbnail: "", genre: "cyberpunk" },
        { id: 2, title: "NEON DRIFT (VIP MIX)", artist: "CRYPTO//DJ", type: "mix", duration: "18:21", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", genre: "electronic mix" },
        { id: 3, title: "ROOTKIT PARADISE", artist: "HACKER SYNDICATE", type: "song", duration: "4:12", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", genre: "industrial" },
        { id: 4, title: "ALMEER OVERDRIVE (Visual)", artist: "DATA_STREAM", type: "video", duration: "5:07", url: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", genre: "visual" },
        { id: 5, title: "TERMINAL VISION", artist: "NEOCODE", type: "song", duration: "3:22", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", genre: "synthwave" },
        { id: 6, title: "MIDNIGHT ENCRYPTION", artist: "ALMEER & FRIENDS", type: "mix", duration: "25:44", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", genre: "deep mix" },
        { id: 7, title: "HEX DRILL (music video)", artist: "R00TK1T", type: "video", duration: "6:21", url: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", genre: "visual" },
        { id: 8, title: "PWN THE AIRWAVES", artist: "ALMEER", type: "song", duration: "3:58", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", genre: "hacker anthem" },
        { id: 9, title: "DARKNET RITUALS (Continuous mix)", artist: "DJ_CRYPT", type: "mix", duration: "32:10", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", genre: "techno mix" },
        { id: 10, title: "FIREWALL BREACH (Official Video)", artist: "ALMEER VISIONS", type: "video", duration: "4:55", url: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4", genre: "visual" }
    ];

    // additional mixes and videos for more content
    const EXTRA = [
        { id: 11, title: "KERNEL PANIC", artist: "SYNTAX ERROR", type: "song", duration: "3:09", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", genre: "chiptune" },
        { id: 12, title: "ALMEER BOOTLEG MIXTAPE", artist: "ALMEER", type: "mix", duration: "45:00", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3", genre: "bass mix" },
        { id: 13, title: "CIRCUIT OVERLOAD (live video)", artist: "H4CK3R", type: "video", duration: "7:12", url: "http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", genre: "visual" }
    ];
    const fullLibrary = [...LIBRARY, ...EXTRA];

    // DOM elements
    const gridContainer = document.getElementById('musicGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryBtns = document.querySelectorAll('.cat-btn');
    let activeCategory = 'all';
    let currentTrack = null;      // current track object
    let audioPlayer = new Audio();  // main player (handles both audio and video? but video we handle via URL play in new window? We'll support video: play video in popup? best: use audio element for audio/mixes, for video we open modal? but we want seamless, video can be played in player? we can also set audioPlayer.src to video but only audio will play. better: if video, we open in new tab or embed? I'll implement: when video track clicked, it opens in a new mini modal? but hacker way: quick popup player? we will implement: if video, create an overlay video player? but for simplicity & functional: clicking play on video will open the video in a new tab with native controls. also download works.
    // For music/mix, we play inside audio element.
    let isPlaying = false;

    // helper: show toast
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = isError ? `⚠️ ${msg}` : `✔️ ${msg}`;
        toast.style.color = isError ? '#ff8888' : '#b0ffea';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    // DOWNLOAD function: real working download via fetch + blob
    async function downloadMedia(track) {
        try {
            showToast(`🕸️ fetching ${track.title}...`);
            const response = await fetch(track.url);
            if (!response.ok) throw new Error('network fail');
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            let ext = '';
            if (track.type === 'video') ext = '.mp4';
            else ext = '.mp3';
            const fileName = `${track.title.replace(/[^a-z0-9]/gi, '_')}_ALMEER${ext}`;
            a.href = blobUrl;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
            showToast(`✅ DOWNLOADED : ${track.title}.${ext.replace('.','')} | ${Math.round(blob.size/1024)} KB`);
        } catch(err) {
            console.error(err);
            showToast(`dl failed: ${track.title} — use alt source`, true);
        }
    }

    // play logic (for songs/mixes)
    function playTrack(track) {
        if (!track) return;
        // handle video separately
        if (track.type === 'video') {
            // hacker style: open video in new tab with direct stream
            window.open(track.url, '_blank');
            showToast(`🎬 playing video externally: ${track.title}`);
            // also update now playing info but not audio player
            document.getElementById('nowPlayingTitle').innerText = `▶️ VIDEO: ${track.title}`;
            document.getElementById('nowPlayingArtist').innerText = track.artist;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playPauseBtn').innerText = '▶️';
            }
            currentTrack = track;
            return;
        }
        // audio / mix stream
        if (currentTrack && currentTrack.id === track.id && audioPlayer.src === track.url) {
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                document.getElementById('playPauseBtn').innerText = '▶️';
            } else {
                audioPlayer.play();
                isPlaying = true;
                document.getElementById('playPauseBtn').innerText = '⏸️';
            }
            return;
        }
        // new track
        audioPlayer.pause();
        audioPlayer.src = track.url;
        currentTrack = track;
        audioPlayer.load();
        audioPlayer.play().catch(e => {
            console.warn("autoplay blocked?", e);
            showToast("⚠️ click play manually (browser policy)", true);
        });
        isPlaying = true;
        document.getElementById('playPauseBtn').innerText = '⏸️';
        document.getElementById('nowPlayingTitle').innerText = `🎧 ${track.title}`;
        document.getElementById('nowPlayingArtist').innerText = track.artist;
        
        // update duration & time
        audioPlayer.addEventListener('loadedmetadata', () => {
            if (!isNaN(audioPlayer.duration)) {
                const dur = formatTime(audioPlayer.duration);
                document.getElementById('durationTime').innerText = dur;
                document.getElementById('seekSlider').max = Math.floor(audioPlayer.duration);
            }
        });
    }
    
    function formatTime(secs) {
        const minutes = Math.floor(secs / 60);
        const seconds = Math.floor(secs % 60);
        return `${minutes}:${seconds.toString().padStart(2,'0')}`;
    }
    
    // update progress
    function updateProgress() {
        if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
            const current = audioPlayer.currentTime;
            document.getElementById('currentTime').innerText = formatTime(current);
            document.getElementById('seekSlider').value = current;
        }
    }
    audioPlayer.addEventListener('timeupdate', updateProgress);
    audioPlayer.addEventListener('ended', () => {
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = '▶️';
        document.getElementById('seekSlider').value = 0;
        document.getElementById('currentTime').innerText = '0:00';
    });
    
    document.getElementById('seekSlider').addEventListener('input', (e) => {
        if (audioPlayer.duration) {
            audioPlayer.currentTime = e.target.value;
        }
    });
    document.getElementById('playPauseBtn').addEventListener('click', () => {
        if (!currentTrack) { showToast("select a track first", true); return; }
        if (currentTrack.type === 'video') {
            window.open(currentTrack.url, '_blank');
            return;
        }
        if (audioPlayer.paused) {
            audioPlayer.play();
            isPlaying = true;
            document.getElementById('playPauseBtn').innerText = '⏸️';
        } else {
            audioPlayer.pause();
            isPlaying = false;
            document.getElementById('playPauseBtn').innerText = '▶️';
        }
    });
    document.getElementById('stopBtn').addEventListener('click', () => {
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
        isPlaying = false;
        document.getElementById('playPauseBtn').innerText = '▶️';
        document.getElementById('currentTime').innerText = '0:00';
        if (currentTrack && currentTrack.type !== 'video') {
            document.getElementById('nowPlayingTitle').innerText = `⏹️ stopped`;
        }
    });
    
    // render cards based on search & category
    function renderLibrary() {
        const searchTerm = searchInput.value.toLowerCase();
        let filtered = fullLibrary.filter(item => {
            if (activeCategory !== 'all' && item.type !== activeCategory) return false;
            if (searchTerm && !item.title.toLowerCase().includes(searchTerm) && !item.artist.toLowerCase().includes(searchTerm) && !item.genre.toLowerCase().includes(searchTerm)) return false;
            return true;
        });
        if (filtered.length === 0) {
            gridContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:50px;">⛔ no tracks found // exploit the void</div>`;
            return;
        }
        gridContainer.innerHTML = filtered.map(track => `
            <div class="track-card" data-id="${track.id}">
                <div class="card-title">${escapeHtml(track.title)}</div>
                <div class="card-artist">${escapeHtml(track.artist)}</div>
                <div class="type-badge">${track.type.toUpperCase()} · ${track.duration}</div>
                <div class="actions">
                    <button class="btn btn-primary play-now" data-id="${track.id}">▶️ PLAY</button>
                    <button class="btn download-btn" data-id="${track.id}">⬇️ DOWNLOAD</button>
                </div>
            </div>
        `).join('');
        
        // attach event listeners
        document.querySelectorAll('.play-now').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const track = fullLibrary.find(t => t.id === id);
                if (track) playTrack(track);
            });
        });
        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const id = parseInt(btn.dataset.id);
                const track = fullLibrary.find(t => t.id === id);
                if (track) await downloadMedia(track);
            });
        });
        // also card click play
        document.querySelectorAll('.track-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if(e.target.classList.contains('btn')) return;
                const id = parseInt(card.dataset.id);
                const track = fullLibrary.find(t => t.id === id);
                if(track) playTrack(track);
            });
        });
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    // category filtering
    categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            categoryBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.cat;
            renderLibrary();
        });
    });
    
    searchInput.addEventListener('input', () => renderLibrary());
    
    // default load
    renderLibrary();
    
    // extra hacker effect: console greeting
    console.log("%c🔥 ALMEER MUSIC // system ready // root://stream.api", "color: #0f9; font-size:16px");
    // bonus: make sure video tracks are downloadable and playable. also mixes.
    // the download function uses fetch -> blob -> download.
    // This is fully working in modern browsers with CORS (the urls are public and CORS enabled)
    showToast(">_ SYSTEM BOOT: ALMEER NODE ACTIVE", false);
</script>
</body>
</html>
